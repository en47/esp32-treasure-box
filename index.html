<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電子密碼寶盒 · 實體概念動畫</title>
<style>
:root{--ink:#2b2838;--muted:#7a7590;--accent:#7b6cc4;--line:#ddd6ee;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9e5f1;color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;}
.stage{width:min(100%, calc((100vh - 150px) * 16 / 9));min-width:min(100%,560px);aspect-ratio:16/9;position:relative;
  border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(70,50,120,.16);background:#f7f4fb;}
body.clean .stage{width:min(100%, calc((100vh - 20px) * 16 / 9));}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;}
.mono{font-family:"SF Mono","Menlo","Consolas","Roboto Mono",monospace;}
svg.manual [data-act]{cursor:pointer}
[data-act="reveal"]{cursor:pointer}
.bar{width:min(100%, calc((100vh - 150px) * 16 / 9));min-width:min(100%,560px);background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 18px rgba(70,50,120,.08)}
body.clean .bar{display:none}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row.hidden{display:none}
.spacer{flex:1}
button,select{font:inherit;font-size:14px;border:1px solid var(--line);background:#f6f4fb;color:var(--ink);
  border-radius:10px;padding:7px 12px;cursor:pointer;transition:background .15s,transform .05s}
button:hover{background:#ece8f7}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.primary:hover{background:#6a5bb5}
button.green{background:#38a865;border-color:#38a865;color:#fff;font-weight:700}
button.green:hover{background:#2f9257}
.tabs{display:flex;background:#f1eef8;border-radius:12px;padding:3px}
.tab{border:none;background:transparent;font-weight:600;color:var(--muted)}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.guess{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.guess b{padding:0 8px;color:var(--accent);font-family:"SF Mono",Menlo,Consolas,monospace}
.guess input{border:none;outline:none;font:15px "SF Mono",Menlo,Consolas,monospace;width:84px;padding:7px 6px 7px 0;letter-spacing:2px}
.hint{font-size:13px;color:var(--muted)}
.hint.err{color:#c9473d}
.hint.ok{color:#2f9257}
</style>
</head>
<body>

<div class="stage" id="stage">
<svg id="svg" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbfe"/><stop offset=".55" stop-color="#f2eef9"/><stop offset="1" stop-color="#e6e0f2"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="underGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a99ae0" stop-opacity=".55"/><stop offset="1" stop-color="#a99ae0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".26"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="acrylic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe9f7" stop-opacity=".30"/><stop offset=".5" stop-color="#c9d8ee" stop-opacity=".12"/><stop offset="1" stop-color="#b9c9e4" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="btnTop" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#8ef0b0"/><stop offset=".6" stop-color="#3fbf6e"/><stop offset="1" stop-color="#2a9356"/>
    </radialGradient>
    <radialGradient id="ledGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff5a4e" stop-opacity=".95"/><stop offset=".3" stop-color="#ff6a5e" stop-opacity=".45"/><stop offset="1" stop-color="#ff6a5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="espGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#5aa0ff" stop-opacity=".9"/><stop offset="1" stop-color="#5aa0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e0ee"/><stop offset=".5" stop-color="#c9c3d9"/><stop offset="1" stop-color="#b3acc6"/>
    </linearGradient>
    <linearGradient id="appIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a596e6"/><stop offset="1" stop-color="#6e5ec0"/>
    </linearGradient>
    <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="blur5" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="insetClip"><rect x="48" y="576" width="240" height="220" rx="6"/></clipPath>
    <clipPath id="logClip"><rect x="0" y="220" width="262" height="320"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bgG)"/>
  <ellipse cx="620" cy="720" rx="560" ry="190" fill="url(#spot)"/>

  <!-- 標題 -->
  <g>
    <text x="44" y="56" font-size="30" font-weight="800" fill="#2b2838" letter-spacing="1">電子密碼寶盒</text>
    <text x="44" y="82" font-size="13.5" fill="#7a7590" letter-spacing=".5">Electronic Password Treasure Box · 實體成品概念動畫</text>
  </g>

  <g id="statusL"></g>
  <g id="boxL"></g>
  <g id="labelsL"></g>
  <g id="fxL"></g>
  <g id="insetL"></g>
  <g id="phoneL"></g>
  <g id="pktL"></g>
  <g id="bannerL"></g>
  <g id="capL"></g>
</svg>
</div>

<div class="bar" id="bar">
  <div class="row">
    <div class="tabs">
      <button class="tab on" id="tabDemo">自動展示 Demo</button>
      <button class="tab" id="tabMan">手動互動 Interactive</button>
    </div>
    <span class="spacer"></span>
    <label>速度
      <select id="speed">
        <option value="0.5">0.5x</option><option value="1" selected>1x</option>
        <option value="1.5">1.5x</option><option value="2">2x</option>
      </select>
    </label>
    <button id="btnMute">🔊 音效：開</button>
    <button id="btnXray">剖面透視：關</button>
    <button id="btnHide" title="快捷鍵 H">隱藏控制列 (H)</button>
  </div>

  <div class="row" id="demoPanel">
    <button class="primary" id="btnPlay">▶ PLAY DEMO</button>
    <button id="btnReplay">↺ 重新播放</button>
    <label><input type="checkbox" id="chkLoop"> 循環播放</label>
    <label>流程
      <select id="script">
        <option value="all">完整流程 Scene 1–7</option>
        <option value="main">解謎流程 Scene 1–6</option>
        <option value="giveup">放棄機制 Scene 7（獨立）</option>
      </select>
    </label>
    <span class="hint">Demo Mode：固定示範密碼 1234（不顯示於手機）· 空白鍵 播放/暫停</span>
  </div>

  <div class="row hidden" id="manPanel">
    <button data-m="connect">Connect BLE</button>
    <button data-m="NEW">NEW</button>
    <span class="guess"><b>P</b><input id="guessIn" maxlength="6" inputmode="numeric" placeholder="1234" autocomplete="off"></span>
    <button class="primary" data-m="guess">Guess</button>
    <button data-m="STATUS">STATUS</button>
    <button data-m="LOCK">LOCK</button>
    <button class="green" data-m="giveup">Give Up 實體按鈕</button>
    <button data-m="lid" id="btnLid">Open Lid</button>
    <button data-m="reset">Reset</button>
    <span class="hint" id="manHint">Interactive Mode：ESP32 隨機產生四位不重複密碼</span>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   電子密碼寶盒 · 實體概念動畫
   結構：
   1. 幾何常數（可調整機構尺寸）      2. 2.5D 投影引擎
   3. 寶盒/零件繪製                   4. 時間線引擎（Lane / Director）
   5. 韌體邏輯（對應 MicroPython）    6. 手機 BLE、Demo 腳本
   7. 畫面渲染、音效、UI 綁定
   所有動畫皆由單一 requestAnimationFrame 迴圈 + 虛擬時鐘驅動，
   暫停 = 時鐘停止，重播 = 重新建立狀態，不使用 setTimeout 排程。
   ===================================================================== */

/* ---------- 1. 幾何常數（單位約為 mm） ---------- */
const GEO = {
  W: 220, D: 150, H: 110,   // 盒身 寬 / 深 / 高
  T: 28,                    // 盒蓋厚度
  t: 6,                     // 壁厚
  LID_MAX: 100 * Math.PI/180,           // 盒蓋最大開啟角
  // 伺服馬達：轉軸朝前（-y），鎖臂在 x-z 平面旋轉
  servo: { xs: 96, zs: 52, len: 26 },   // 轉軸位置、鎖臂長度
  // 鎖鉤（固定在盒蓋下方）：垂直板 + 向左伸出的鉤唇
  tab: { a: [126, 34, 38.5], b: [134, 40, 110] },
  lip: { a: [112, 34, 38.5], b: [134, 49, 45.5] },
  GAP: 3                    // 鉤唇與鎖臂下緣的間隙
};
// 上鎖時盒蓋最多只能抬起的角度：鉤唇上升 GAP 即碰到鎖臂
const BLOCK_LIFT = GEO.GAP / (GEO.D - 42);
// 動畫時長（ms，1x 速度），方便調整
const TIMING = { servo: 650, lidOpen: 1900, lidClose: 1600, packet: 420, autoLock: 5000 };

const C = { cream:'#f4efe5', inner:'#e8e0d2', lid:'#cfc5ec', felt:'#7a68bf', wood:'#d9b88b',
  servo:'#3f7de0', arm:'#f2a650', metal:'#a9b2bf', pcb:'#1e2733', bracket:'#e7e2d7', accent:'#7b6cc4' };

/* ---------- 2. 2.5D 投影引擎 ---------- */
// x：向右、y：向後（深度）、z：向上。平行投影，因此任何平面都可用一個 SVG matrix 精確表示。
const PJ = { S: 1.9, ox: 330, oy: 705, ex: [0.961, 0.276], ey: [0.53, -0.36] };
const f = n => Math.round(n * 100) / 100;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dot3 = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const norm3 = v => { const l = Math.hypot(v[0], v[1], v[2]); return v.map(x => x / l); };
function P(x, y, z){ return [PJ.ox + (x*PJ.ex[0] + y*PJ.ey[0]) * PJ.S, PJ.oy + (x*PJ.ex[1] + y*PJ.ey[1] - z) * PJ.S]; }
function PV(v){ return [(v[0]*PJ.ex[0] + v[1]*PJ.ey[0]) * PJ.S, (v[0]*PJ.ex[1] + v[1]*PJ.ey[1] - v[2]) * PJ.S]; }
// 平面座標系 → SVG matrix；det > 0 代表該面朝向觀看者（用於背面剔除）
function M(o, u, v){
  const O = P(o[0], o[1], o[2]), U = PV(u), V = PV(v);
  return { s: `matrix(${f(U[0])} ${f(U[1])} ${f(V[0])} ${f(V[1])} ${f(O[0])} ${f(O[1])})`, det: U[0]*V[1] - U[1]*V[0] };
}
const AX = [1,0,0], AY = [0,1,0], NY = [0,-1,0], NZ = [0,0,-1];
const ID = { p: q => q, v: q => q };
// 盒蓋變換：繞後方鉸鏈軸（平行 x 軸，位於 y=D, z=H）旋轉 th 弧度
function lidXf(th){
  const c = Math.cos(th), s = Math.sin(th), D = GEO.D, H = GEO.H;
  return {
    p: q => { const dy = q[1] - D, dz = q[2] - H; return [q[0], D + dy*c + dz*s, H - dy*s + dz*c]; },
    v: q => [q[0], q[1]*c + q[2]*s, -q[1]*s + q[2]*c]
  };
}
const LIGHT = norm3([0.25, -0.6, 1]);
function hex2rgb(h){ h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i, i+2), 16)); }
function shade(hex, n){
  const d = Math.max(0, dot3(n, LIGHT)), k = 0.70 + 0.34 * d;
  return 'rgb(' + hex2rgb(hex).map(c => Math.min(255, Math.round(c * k))).join(',') + ')';
}
function plane(o, u, v, inner, xf = ID, cull = false){
  const m = M(xf.p(o), xf.v(u), xf.v(v));
  if (cull && m.det <= 0) return '';
  return `<g transform="${m.s}">${inner}</g>`;
}
// 長方體六個面：u 為面上「右」、v 為面上「下」（自外側看）
function cuboidFaces(a, b){
  const [x0,y0,z0] = a, [x1,y1,z1] = b;
  return [
    { k:'front',  o:[x0,y0,z1], u:[1,0,0],  v:[0,0,-1], w:x1-x0, h:z1-z0, n:[0,-1,0] },
    { k:'back',   o:[x1,y1,z1], u:[-1,0,0], v:[0,0,-1], w:x1-x0, h:z1-z0, n:[0,1,0] },
    { k:'right',  o:[x1,y0,z1], u:[0,1,0],  v:[0,0,-1], w:y1-y0, h:z1-z0, n:[1,0,0] },
    { k:'left',   o:[x0,y1,z1], u:[0,-1,0], v:[0,0,-1], w:y1-y0, h:z1-z0, n:[-1,0,0] },
    { k:'top',    o:[x0,y1,z1], u:[1,0,0],  v:[0,-1,0], w:x1-x0, h:y1-y0, n:[0,0,1] },
    { k:'bottom', o:[x0,y0,z0], u:[1,0,0],  v:[0,1,0],  w:x1-x0, h:y1-y0, n:[0,0,-1] }
  ];
}
// 凸多面體只畫朝前的面即可得到正確遮擋
function cuboid(a, b, o = {}){
  const xf = o.xf || ID; let s = '';
  for (const F of cuboidFaces(a, b)){
    const m = M(xf.p(F.o), xf.v(F.u), xf.v(F.v));
    if (m.det <= 1e-6) continue;
    const n = xf.v(F.n);
    const col = (o.colors && o.colors[F.k]) || o.color;
    const op = o.faceOp != null ? o.faceOp : 1;
    s += `<g transform="${m.s}"><rect width="${f(F.w)}" height="${f(F.h)}" fill="${shade(col, n)}"` +
         (op < 1 ? ` fill-opacity="${f(op)}"` : '') +
         ` stroke="${o.stroke || 'rgba(45,35,80,.30)'}" stroke-width="${o.sw || 0.9}" vector-effect="non-scaling-stroke"/>`;
    if (o.sheen !== false) s += `<rect width="${f(F.w)}" height="${f(F.h)}" fill="url(#sheen)" opacity="${f(op)}"/>`;
    if (o.deco && o.deco[F.k]) s += `<g opacity="${f(o.decoOp != null ? o.decoOp : 1)}">${o.deco[F.k](F.w, F.h)}</g>`;
    s += '</g>';
  }
  return s;
}
const rr = (x, y, w, h, r) => `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`;
const NSS = 'vector-effect="non-scaling-stroke"';

/* ---------- 3. 寶盒與零件繪製 ---------- */
// 沿 y 軸、朝前的圓柱（以多層圓片堆疊表現厚度）
function cylY(cx, cz, r, yBack, yFront, side, face, extra = ''){
  let s = ''; const n = Math.max(2, Math.ceil((yBack - yFront) / 0.7));
  for (let i = 0; i < n; i++){ const y = yBack - (yBack - yFront) * i / n;
    s += plane([0,y,0], AX, NZ, `<circle cx="${cx}" cy="${-cz}" r="${r}" fill="${side}"/>`); }
  s += plane([0,yFront,0], AX, NZ, `<circle cx="${cx}" cy="${-cz}" r="${r}" fill="${face}" stroke="rgba(0,0,0,.25)" stroke-width=".8" ${NSS}/>${extra}`);
  return s;
}
function wire(pts, col, w = 1.6){
  return `<polyline points="${pts.map(p => P(p[0],p[1],p[2]).map(f).join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function drawShadow(){
  const pts = [P(-6,-6,-10), P(226,-6,-10), P(226,156,-10), P(-6,156,-10)].map(p => [p[0]+10, p[1]+12]);
  const glow = 0.18 + 0.07 * Math.sin(performance.now() / 900);   // 待機呼吸光
  const c = P(110, 75, -10);
  return `<ellipse cx="${f(c[0]+10)}" cy="${f(c[1]+8)}" rx="330" ry="95" fill="url(#underGlow)" opacity="${f(glow)}"/>` +
    `<polygon points="${pts.map(p => p.map(f).join(',')).join(' ')}" fill="rgba(55,35,100,.28)" filter="url(#blur14)"/>`;
}
function drawBase(){
  const grain = (w, h) => `<path d="M0 ${h*.35}H${w} M0 ${h*.7}H${w*.6} M${w*.65} ${h*.62}H${w}" stroke="rgba(120,80,40,.22)" stroke-width=".8" ${NSS} fill="none"/>`;
  return cuboid([-6,-6,-10], [226,156,0], { color: C.wood, deco: { front: grain, right: grain } });
}
function drawInterior(){
  const { W, D, H, t } = GEO; let s = '';
  s += plane([t, D-t, 6], AX, NY, `<rect width="${W-2*t}" height="${D-2*t}" fill="${shade(C.inner,[0,0,1])}"/>`);
  s += plane([t, D-t, H], AX, NZ, `<rect width="${W-2*t}" height="${H-6}" fill="${shade(C.inner,[0,-1,0])}"/>` +
       `<rect width="${W-2*t}" height="${H-6}" fill="url(#sheen)"/>`);
  s += plane([t, t, H], AY, NZ, `<rect width="${D-2*t}" height="${H-6}" fill="${shade(C.inner,[1,0,0])}"/>`);
  return s;
}
function espTop(){
  let s = `<path d="M3 2.5H25M3 2.5V6.5H7V3.8H11V6.5H15V3.8H19V6.5H23V3.8" fill="none" stroke="#caa54c" stroke-width=".7"/>`;
  for (let i = 0; i < 15; i++){ const v = f(13 + i * 2.85);
    s += `<circle cx="1.8" cy="${v}" r=".8" fill="#dcb95e"/><circle cx="26.2" cy="${v}" r=".8" fill="#dcb95e"/>`; }
  s += `<rect x="6" y="48" width="3.4" height="2.6" rx=".4" fill="#ddd"/><rect x="18.6" y="48" width="3.4" height="2.6" rx=".4" fill="#ddd"/>` +
       `<circle cx="14" cy="45" r=".9" fill="#ff5050"/><text x="14" y="40" font-size="2.6" fill="#c9d2e2" text-anchor="middle">ESP32 DEVKIT</text>`;
  return s;
}
function drawESP32(){
  let s = plane([0,0,6.05], AX, NY, `<rect x="21" y="-123" width="31" height="58" rx="2" fill="rgba(0,0,0,.18)"/>`);
  for (const [x,y] of [[24,68],[48,68],[24,120],[48,120]]) s += cuboid([x-1,y-1,6],[x+1,y+1,10],{color:'#c9c1b3',sheen:false});
  s += cuboid([22,66,10], [50,122,11.6], { color: C.pcb, deco: { top: espTop } });
  s += cuboid([25,92,11.6], [47,112,14.2], { color: '#c8cdd5',
    deco: { top: (w,h) => `<text x="${w/2}" y="${h/2+1.5}" font-size="4.2" font-weight="700" fill="#556" text-anchor="middle">ESP32</text><text x="${w/2}" y="${h/2+6}" font-size="2.4" fill="#667" text-anchor="middle">WROOM-32</text>` } });
  s += cuboid([31,63.5,11.6], [41,69,14.4], { color: '#b9bec6' });
  return s;
}
function drawWires(){
  let s = '';
  // SG90 排線：GND(棕) / 5V(紅) / 訊號 GPIO18(橘)
  ['#6b4a2e', '#e04848', '#f08a24'].forEach((c, i) => { const o = i * 1.6;
    s += wire([[85+o,77,50],[85+o,88,34],[70,92+o,7.6],[48.2,94+o*1.3,11.9]], c, 1.5); });
  // LED：GPIO25（黃，經限流電阻）+ GND
  s += wire([[23.8,86,11.9],[14,80,7.4],[14,40,7.4],[20,10,7.4],[33,7,12],[34,7,84]], '#e6c229');

/* ---------- 4. 時間線引擎 ---------- */
// Step 形式：{dur, start(), update(p), end()} 或 {until: () => bool}
// start() 可回傳新的 steps，會插入在同一條 Lane 的最前面（用來處理指令的分支結果）
class Lane {
  constructor(name, steps = []){ this.name = name; this.q = steps.flat(Infinity); this.cur = null; }
  get idle(){ return !this.cur && this.q.length === 0; }
  push(...st){ this.q.push(...st.flat(Infinity)); }
  tick(dt){
    for (let guard = 0; guard < 800; guard++){
      if (!this.cur){
        if (!this.q.length) return;
        this.cur = this.q.shift(); this.cur._e = 0;
        if (this.cur.start){ const ins = this.cur.start(); if (Array.isArray(ins) && ins.length) this.q.unshift(...ins.flat(Infinity)); }
      }
      const c = this.cur;
      if (c.until){ if (c.until()){ c.end && c.end(); this.cur = null; continue; } return; }
      const dur = c.dur || 0, rem = dur - c._e;
      if (dt >= rem){ c._e = dur; c.update && c.update(1); c.end && c.end(); this.cur = null; dt -= rem; continue; }
      c._e += dt; c.update && c.update(c._e / dur); return;
    }
  }
}
const DIR = {
  lanes: {}, running: false, speed: 1,
  reset(){ this.lanes = {}; for (const n of ['script','esp','radio','fx']) this.lanes[n] = new Lane(n); },
  lane(n){ return this.lanes[n] || (this.lanes[n] = new Lane(n)); },
  setLane(n, steps){ this.lanes[n] = new Lane(n, steps); },
  tick(dt){ for (const k of Object.keys(this.lanes)) this.lanes[k].tick(dt); }
};
const EASE = { io: p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2, out: p => 1 - Math.pow(1-p, 3), in: p => p*p, lin: p => p };

// handle_command()
function handleCommand(raw){
  const cmd = raw.trim().toUpperCase();
  if (!cmd) return [];
  if (cmd === 'NEW') return newRound();
  if (cmd === 'STATUS') return rx(G.isOpen ? 'STATUS: BOX OPEN' : G.finished ? 'STATUS: ROUND FINISHED' : 'STATUS: PLAYING');
  if (cmd === 'LOCK') return lockSequence('cmd');
  if (cmd.startsWith('P')) return G.finished ? rx('ROUND FINISHED. TYPE NEW') : checkGuess(cmd.slice(1));
  return rx('UNKNOWN COMMAND');
}
function newRound(){
  if (G.isOpen) return rx('PLEASE WAIT UNTIL LOCKED');
  G.password = generatePassword(); G.gaveUp = false; G.finished = false; G.guesses = 0;
  return [ call(() => { setSys('PLAYING'); S.lastRx = null; banner('NEW ROUND', 'ESP32 已產生新的四位不重複密碼', '#7b6cc4'); }),
    tween('servo', 0, 250), rx('NEW ROUND STARTED'), rx('GUESS 4 UNIQUE DIGITS') ];

// check_guess()：真正計算 A / B
function checkGuess(g){
  if (g.length !== 4) return [call(() => banner('ERROR', '請輸入 4 位數字', '#d0564b')), rx('ERROR: ENTER 4 DIGITS')];
  if (!/^\d+$/.test(g)) return [call(() => banner('ERROR', '只能輸入數字', '#d0564b')), rx('ERROR: NUMBERS ONLY')];
  if (new Set(g).size !== 4) return [call(() => banner('ERROR', '四個數字不可重複', '#d0564b')), rx('ERROR: DIGITS MUST BE UNIQUE')];
  const pw = G.password;
  let a = 0, b = 0;
  for (let i = 0; i < 4; i++) if (g[i] === pw[i]) a++;
  for (const d of g) if (pw.includes(d)) b++;
  b -= a;
  G.guesses++;
  if (a === 4) return unlockSteps();
  const As = [], Bs = [], Ns = [];
  for (let i = 0; i < 4; i++) (g[i] === pw[i] ? As : pw.includes(g[i]) ? Bs : Ns).push(g[i]);
  const parts = [];
  if (As.length) parts.push(`${As.join('、')} → A（位置正確）`);
  if (Bs.length) parts.push(`${Bs.join('、')} → B（位置錯誤）`);
  if (Ns.length) parts.push(`${Ns.join('、')} 不在密碼中`);
  return [ call(() => banner(`${a}A${b}B`, `${g}：` + parts.join('　'), '#d08a2a', 3600)),
    rx(`${a}A${b}B`), wrongFx() ];
}

/* ---------- 音效（Web Audio，方波模擬被動蜂鳴器） ---------- */
const AUDIO = {
  ctx: null, osc: null, gain: null, cur: 0, muted: false,
  init(){
    if (this.ctx){ if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC();
    this.osc = this.ctx.createOscillator(); this.osc.type = 'square';
    const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    this.gain = this.ctx.createGain(); this.gain.gain.value = 0;
    this.osc.connect(lp); lp.connect(this.gain); this.gain.connect(this.ctx.destination); this.osc.start();
  },
  set(fq){
    if (!this.ctx || fq === this.cur) return;
    this.cur = fq; const t = this.ctx.currentTime;
    this.gain.gain.cancelScheduledValues(t);
    if (fq > 0){ this.osc.frequency.setValueAtTime(fq, t); this.gain.gain.setTargetAtTime(0.05, t, 0.004); }
    else this.gain.gain.setTargetAtTime(0, t, 0.006);
  }
};

/* ---------- 主迴圈 ---------- */
let last = performance.now(), pendingRestart = false, demoState = 'idle';
function checkAutoLock(){
  // 對應韌體主迴圈：if is_open and elapsed >= OPEN_TIME: lock_box()
  if (G.autoLockAt != null && S.clock >= G.autoLockAt){ G.autoLockAt = null; DIR.lane('esp').push(lockSequence('auto')); }
}
function frame(now){
  const dt = Math.min(64, now - last); last = now;
  if (DIR.running){
    const v = dt * DIR.speed;
    S.clock += v; DIR.tick(v); checkAutoLock();
    S.packets = S.packets.filter(p => S.clock - p.t0 < p.dur);
    if (pendingRestart){ pendingRestart = false; startDemo(); }
  }
  S.xray += (S.xrayT - S.xray) * Math.min(1, dt / 180);
  if (Math.abs(S.xrayT - S.xray) < 0.002) S.xray = S.xrayT;
  render();
  AUDIO.set(DIR.running && !AUDIO.muted ? S.buzz : 0);
  updateLive();
  requestAnimationFrame(frame);
}

/* ---------- UI ---------- */
function resetAll(mode){
  if (mode) MODE = mode;
  DIR.reset(); S = initState(); G = initGame(); boxKey = '';
  AUDIO.set(0);
  DIR.running = MODE === 'manual';
  demoState = 'idle';
  $('svg').classList.toggle('manual', MODE === 'manual');
  updateUI();
}
function startDemo(){
  AUDIO.init();
  resetAll('demo');
  DIR.lane('script').push(buildScript($('script').value));
  DIR.running = true; demoState = 'playing'; updateUI();
}
function togglePlay(){
  if (MODE !== 'demo') return;
  AUDIO.init();
  if (demoState === 'idle' || demoState === 'ended') startDemo();
  else if (demoState === 'playing'){ demoState = 'paused'; DIR.running = false; AUDIO.set(0); }
  else { demoState = 'playing'; DIR.running = true; }
  updateUI();
}
function updateUI(){
  $('tabDemo').classList.toggle('on', MODE === 'demo');
  $('tabMan').classList.toggle('on', MODE === 'manual');
  $('demoPanel').classList.toggle('hidden', MODE !== 'demo');
  $('manPanel').classList.toggle('hidden', MODE !== 'manual');
  $('btnPlay').textContent = demoState === 'playing' ? '❚❚ 暫停' : demoState === 'paused' ? '▶ 繼續播放' : '▶ PLAY DEMO';
  $('btnMute').textContent = AUDIO.muted ? '🔇 音效：關' : '🔊 音效：開';
}
let liveCache = {};
function setText(id, txt, cls){
  if (liveCache[id] === txt + cls) return; liveCache[id] = txt + cls;
  const el = $(id); el.textContent = txt; if (cls != null) el.className = 'hint ' + cls;
}
function updateLive(){
  const x = S.xrayT > 0.5 ? '剖面透視：開' : '剖面透視：關';
  if ($('btnXray').textContent !== x) $('btnXray').textContent = x;
  if (MODE !== 'manual') return;
  const lidTxt = S.lid > 0.02 ? 'Close Lid' : 'Open Lid';
  if ($('btnLid').textContent !== lidTxt) $('btnLid').textContent = lidTxt;
  const busy = !DIR.lane('esp').idle || !DIR.lane('radio').idle;
  const v = $('guessIn').value.trim();
  let msg = 'Interactive Mode：ESP32 隨機產生四位不重複密碼', cls = '';
  if (busy) msg = 'ESP32 動作中… 新指令會依序排隊執行';
  else if (G.autoLockAt != null) msg = `盒蓋已開啟 · ${((G.autoLockAt - S.clock)/1000).toFixed(1)} 秒後自動上鎖`;
  if (v){
    if (!/^\d*$/.test(v)) { msg = '只能輸入數字（ESP32 會回傳 ERROR: NUMBERS ONLY）'; cls = 'err'; }
    else if (v.length !== 4) { msg = '需輸入 4 位數字（ESP32 會回傳 ERROR: ENTER 4 DIGITS）'; cls = 'err'; }
    else if (new Set(v).size !== 4) { msg = '數字不可重複（ESP32 會回傳 ERROR: DIGITS MUST BE UNIQUE）'; cls = 'err'; }
    else { msg = '✓ 四個不重複數字，按 Guess 或 Enter 送出'; cls = 'ok'; }
  }
  setText('manHint', msg, cls);
}
let hintUntil = 0;
function manualAct(act){
  AUDIO.init();
  const esp = DIR.lane('esp');
  if (act === 'reset'){ resetAll('manual'); return; }
  if (act === 'connect'){
    if (S.ble !== 'off' || S._connQ) return;
    S._connQ = true; esp.push(connectSteps(false)); return;
  }
  if (act === 'lid'){ esp.push(userLidToggle()); return; }
  if (S.ble !== 'connected'){ S.capTitle = '尚未連線'; S.capSub = '請先按 Connect BLE，手機才能傳送指令'; banner('請先連線 BLE', '按下 Connect BLE 開始掃描', '#d0564b'); return; }
  if (act === 'giveup'){ esp.push(giveUpSteps()); return; }
  if (act === 'guess'){
    const v = $('guessIn').value.trim();
    if (!v){ banner('請輸入密碼', '四個不重複數字，例如 1234', '#d0564b'); return; }
    esp.push(sendCommand('P' + v, 45)); $('guessIn').value = ''; return;
  }
  esp.push(sendCommand(act, 45));
}

$('btnReplay').onclick = () => startDemo();
$('speed').onchange = e => { DIR.speed = parseFloat(e.target.value); };
$('btnMute').onclick = () => { AUDIO.muted = !AUDIO.muted; AUDIO.set(0); updateUI(); };
$('btnXray').onclick = () => { S.xrayT = S.xrayT > 0.5 ? 0 : 1; };
$('btnHide').onclick = () => document.body.classList.toggle('clean');
document.querySelectorAll('#manPanel [data-m]').forEach(b => b.onclick = () => manualAct(b.dataset.m));
$('guessIn').addEventListener('keydown', e => { if (e.key === 'Enter') manualAct('guess'); });
$('svg').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'reveal'){ S.reveal = !S.reveal; return; }
  if (MODE !== 'manual') return;
  if (act === 'connect') manualAct('connect');
  else if (act.startsWith('cmd:')) manualAct(act.slice(4));
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    AUDIO.set(0);
    if (MODE === 'demo' && demoState === 'playing'){ demoState = 'paused'; DIR.running = false; updateUI(); }
    if (AUDIO.ctx) AUDIO.ctx.suspend();
  } else if (AUDIO.ctx) AUDIO.ctx.resume();
  last = performance.now();
});

resetAll('demo');
requestAnimationFrame(frame);
</script>
</body>
</html>
